<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GLASS TETRIS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;}

#bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 90% 70% at 15% 20%, rgba(120,0,255,0.65) 0%, transparent 58%),
    radial-gradient(ellipse 80% 60% at 88% 72%, rgba(0,80,255,0.58) 0%, transparent 55%),
    radial-gradient(ellipse 70% 55% at 50% 100%,rgba(255,20,100,0.52) 0%, transparent 55%),
    radial-gradient(ellipse 60% 45% at 92% 8%,  rgba(0,210,180,0.48) 0%, transparent 50%),
    radial-gradient(ellipse 50% 40% at 3%  82%,  rgba(255,110,0,0.44) 0%, transparent 48%),
    radial-gradient(ellipse 40% 35% at 55% 45%, rgba(255,220,0,0.22) 0%, transparent 45%),
    #03000f;
  animation:nebShift 22s ease-in-out infinite alternate;
}
@keyframes nebShift{
  0%  {filter:hue-rotate(0deg)   brightness(1)    saturate(1.3);}
  25% {filter:hue-rotate(25deg)  brightness(1.15) saturate(1.5);}
  55% {filter:hue-rotate(-18deg) brightness(1.08) saturate(1.6);}
  80% {filter:hue-rotate(10deg)  brightness(1.04) saturate(1.4);}
  100%{filter:hue-rotate(-8deg)  brightness(0.96) saturate(1.2);}
}

#stars{position:fixed;inset:0;z-index:1;pointer-events:none;}
#particles{position:fixed;inset:0;z-index:3;pointer-events:none;}

#app{
  position:relative;z-index:10;
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;
}

/* ── compact HUD bar sits flush above the game canvas ── */
#hud{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 8px 3px;
  flex-shrink:0;
  gap:4px;
}
/* each pill is tiny — label + value on one line */
.hud-box{
  background:rgba(0,0,0,0.40);
  border:1px solid rgba(255,255,255,0.13);
  border-radius:8px;
  padding:3px 9px;
  backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:5px;
  white-space:nowrap;
  box-shadow:0 1px 8px rgba(0,0,0,0.5);
  flex:1;justify-content:center;
}
.hud-label{
  font-family:'Orbitron',sans-serif;
  font-size:6px;letter-spacing:2px;
  color:rgba(255,255,255,0.38);
  text-transform:uppercase;
}
.hud-val{
  font-family:'Orbitron',sans-serif;
  font-size:13px;font-weight:900;color:#fff;
  text-shadow:0 0 10px rgba(0,230,255,0.9),0 0 22px rgba(0,230,255,0.4);
}
#logo{
  font-family:'Orbitron',sans-serif;
  font-size:9px;font-weight:900;letter-spacing:4px;
  background:linear-gradient(130deg,#00e5ff 0%,#bf5fff 50%,#ff5f7e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:logoPulse 3s ease-in-out infinite;
  white-space:nowrap;flex-shrink:0;
}
@keyframes logoPulse{
  0%,100%{filter:drop-shadow(0 0 6px rgba(0,229,255,0.8));}
  50%{filter:drop-shadow(0 0 20px rgba(191,95,255,1));}
}

#game-wrap{
  position:relative;
  flex:1;
  display:flex;align-items:center;justify-content:center;
  width:100%;overflow:hidden;
}

/* The main game canvas is transparent — nebula shows through! */
#cv{
  display:block;
  position:relative;z-index:5;
  image-rendering:pixelated;
}

/* ── NEXT piece — top-right corner of game, 2× smaller ── */
#next-panel{
  position:absolute;top:4px;right:4px;z-index:20;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;padding:5px 5px 4px;
  backdrop-filter:blur(24px);
  box-shadow:0 0 14px rgba(0,229,255,0.07);
  text-align:center;
}
.np-label{
  font-family:'Orbitron',sans-serif;font-size:6px;letter-spacing:1.5px;
  color:rgba(255,255,255,0.28);margin-bottom:3px;
}
#ncv{display:block;margin:0 auto;}

/* ── LEVEL — top-left corner of game ── */
#lv-panel{
  position:absolute;top:4px;left:4px;z-index:20;
  background:rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;padding:4px 9px;
  backdrop-filter:blur(24px);text-align:center;
  display:flex;align-items:center;gap:5px;
}

#flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity 0.04s;}

#combo{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  z-index:60;pointer-events:none;
  font-family:'Orbitron',sans-serif;
  font-weight:900;letter-spacing:4px;
  opacity:0;transition:transform 0.13s cubic-bezier(0.34,1.56,0.64,1),opacity 0.35s;
}

/* score pop floaters */
.spop{
  position:fixed;z-index:65;pointer-events:none;
  font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;
  color:#fff;letter-spacing:2px;
  text-shadow:0 0 14px rgba(0,229,255,0.9);
  animation:popUp 0.8s forwards;
}
@keyframes popUp{
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-70px) scale(1.3);}
}

#overlay{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:rgba(3,0,15,0.82);backdrop-filter:blur(20px);
}
.ov-box{
  text-align:center;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.13);
  border-radius:28px;padding:42px 50px;
  box-shadow:0 0 80px rgba(0,229,255,0.12),0 0 40px rgba(191,95,255,0.1);
  animation:ovIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes ovIn{from{transform:scale(0.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.ov-title{
  font-family:'Orbitron',sans-serif;font-size:34px;font-weight:900;letter-spacing:5px;
  background:linear-gradient(130deg,#00e5ff,#bf5fff,#ff5f7e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1.18;margin-bottom:7px;
  white-space:pre-line;
}
.ov-sub{font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:3px;margin-bottom:22px;}
.ov-score{
  font-family:'Orbitron',sans-serif;font-size:42px;font-weight:900;
  color:#fff;text-shadow:0 0 24px rgba(0,229,255,0.9);margin-bottom:28px;
}
.ov-hint{font-size:11px;color:rgba(255,255,255,0.28);letter-spacing:1.5px;line-height:2;margin-bottom:24px;}
#start-btn{
  font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;
  padding:15px 42px;border-radius:50px;border:none;
  background:linear-gradient(135deg,#00e5ff,#2979ff);color:#000;cursor:pointer;
  box-shadow:0 0 30px rgba(0,229,255,0.6),0 8px 24px rgba(0,0,0,0.4);
  transition:transform 0.15s,box-shadow 0.15s;
}
#start-btn:hover{transform:scale(1.06);box-shadow:0 0 50px rgba(0,229,255,0.9);}
#start-btn:active{transform:scale(0.96);}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="stars"></canvas>
<canvas id="particles"></canvas>
<div id="flash"></div>
<div id="combo"></div>

<div id="overlay">
  <div class="ov-box">
    <div class="ov-title" id="ov-title">GLASS
TETRIS</div>
    <div class="ov-sub" id="ov-sub">COSMIC EDITION</div>
    <div class="ov-score" id="ov-score" style="display:none"></div>
    <div class="ov-hint">
      TAP LEFT SIDE → move left &nbsp;|&nbsp; TAP RIGHT SIDE → move right<br>
      SWIPE LEFT / RIGHT → move &nbsp;|&nbsp; SWIPE UP → rotate<br>
      SWIPE DOWN → hard drop
    </div>
    <button id="start-btn">▶ PLAY</button>
  </div>
</div>

<div id="app">
  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">Score</div>
      <div class="hud-val" id="h-score">0</div>
    </div>
    <div id="logo">TETRIS</div>
    <div class="hud-box">
      <div class="hud-label">Best</div>
      <div class="hud-val" id="h-best">0</div>
    </div>
  </div>

  <div id="game-wrap">
    <canvas id="cv"></canvas>
    <!-- level top-left of game board -->
    <div id="lv-panel">
      <div class="hud-label">LV</div>
      <div class="hud-val" id="h-level">1</div>
    </div>
    <!-- next piece top-right of game board, smaller canvas -->
    <div id="next-panel">
      <div class="np-label">NEXT</div>
      <canvas id="ncv"></canvas>
    </div>
  </div>
</div>

<script>
/* ══ STARS ══ */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');
  let S=[];
  function rs(){
    c.width=innerWidth;c.height=innerHeight;S=[];
    for(let i=0;i<320;i++)S.push({
      x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*2+0.1,a:Math.random(),
      da:(Math.random()-0.5)*0.013,
      col:`hsl(${190+Math.random()*120},70%,90%)`
    });
  }
  function d(){
    x.clearRect(0,0,c.width,c.height);
    S.forEach(s=>{
      s.a=Math.max(0.04,Math.min(1,s.a+s.da));
      if(s.a<=0.04||s.a>=1)s.da*=-1;
      x.save();x.globalAlpha=s.a;x.fillStyle=s.col;
      x.shadowColor=s.col;x.shadowBlur=s.r>1.2?4:0;
      x.beginPath();x.arc(s.x,s.y,s.r,0,Math.PI*2);x.fill();
      x.restore();
    });
    requestAnimationFrame(d);
  }
  rs();d();window.addEventListener('resize',rs);
})();

/* ══ AUDIO ══ */
let AC=null;
function getAC(){
  if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
  return AC;
}
function resumeAC(){const a=getAC();if(a&&a.state==='suspended')a.resume();}

function tone(freq,type,dur,vol=0.15,delay=0,freqEnd){
  const a=getAC();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
  o.connect(g);g.connect(a.destination);
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(freqEnd)o.frequency.exponentialRampToValueAtTime(freqEnd,t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t);o.stop(t+dur+0.05);
}

function sfxMove(){tone(280,'sine',0.05,0.06);}
function sfxRotate(){tone(420,'triangle',0.07,0.09,0,600);}
function sfxLock(){tone(180,'sawtooth',0.07,0.11);tone(130,'sawtooth',0.1,0.08,0.05);}
function sfxDrop(){tone(160,'sawtooth',0.1,0.16,0,80);tone(110,'square',0.14,0.1,0.07);}
function sfxClear(n){
  const f=[0,500,620,780,1000];
  for(let i=0;i<=n;i++)tone(f[Math.min(i,4)]+(i*40),'sine',0.2,0.18,i*0.07);
  if(n>=4)setTimeout(()=>{[800,1000,1300,1600].forEach((f,i)=>tone(f,'sine',0.18,0.2,i*0.06));},300);
}
function sfxGameOver(){[380,300,230,170,120].forEach((f,i)=>tone(f,'sawtooth',0.22,0.14,i*0.13));}
function sfxLevelUp(){[450,550,700,900,1200,1600].forEach((f,i)=>tone(f,'sine',0.18,0.16,i*0.065));}

/* ══ PARTICLES ══ */
const PC=document.getElementById('particles'),PX=PC.getContext('2d');
let pts=[];
function rsPC(){PC.width=innerWidth;PC.height=innerHeight;}
rsPC();window.addEventListener('resize',rsPC);

function burst(cx,cy,col,n=16,spd=5){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=1.5+Math.random()*spd;
    pts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      r:1.5+Math.random()*4,life:1,dec:0.022+Math.random()*0.025,col});
  }
}
function burstLine(ry,cols,bpx,rect){
  const cs=['#00e5ff','#ff6d00','#ea80fc','#ff1744','#ffd600','#00e676','#80b0ff'];
  for(let c=0;c<cols;c++)burst(
    rect.left+(c+0.5)*bpx, rect.top+(ry+0.5)*bpx,
    cs[c%cs.length], 7, 4
  );
}
(function animPts(){
  PX.clearRect(0,0,PC.width,PC.height);
  pts=pts.filter(p=>p.life>0.01);
  pts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=p.dec;
    PX.save();PX.globalAlpha=Math.max(0,p.life);
    PX.fillStyle=p.col;PX.shadowColor=p.col;PX.shadowBlur=10;
    PX.beginPath();PX.arc(p.x,p.y,p.r,0,Math.PI*2);PX.fill();
    PX.restore();
  });
  requestAnimationFrame(animPts);
})();

/* ══ TETRIS ══ */
const COLS=10,ROWS=20;
let B=30; // block size

const CL=[null,
  {h:'#6fffff',m:'#00d4ef',d:'#005060',e:'rgba(0,210,240,0.18)'},
  {h:'#ffcc66',m:'#ff8800',d:'#7f3800',e:'rgba(255,136,0,0.18)'},
  {h:'#f080ff',m:'#cc40ee',d:'#5a0077',e:'rgba(200,50,240,0.18)'},
  {h:'#ff7070',m:'#ff1840',d:'#800010',e:'rgba(255,20,60,0.18)'},
  {h:'#ffff66',m:'#f0cc00',d:'#705800',e:'rgba(240,200,0,0.18)'},
  {h:'#70ffa0',m:'#00e060',d:'#004828',e:'rgba(0,210,80,0.18)'},
  {h:'#88bbff',m:'#2868ff',d:'#0e1e60',e:'rgba(40,90,255,0.18)'},
];

const SH=[null,
  [[1,1,1,1]],
  [[2,2],[2,2]],
  [[0,3,0],[3,3,3]],
  [[0,4,4],[4,4,0]],
  [[5,5,0],[0,5,5]],
  [[6,0,0],[6,6,6]],
  [[0,0,7],[7,7,7]],
];

const gc=document.getElementById('cv'),gx=gc.getContext('2d');
const nc=document.getElementById('ncv'),nx=nc.getContext('2d');

function resize(){
  const wrap=document.getElementById('game-wrap');
  const avH=wrap.clientHeight, avW=wrap.clientWidth;
  B=Math.floor(Math.min(avH/ROWS, avW/COLS));
  B=Math.max(22,Math.min(52,B));
  gc.width=COLS*B;gc.height=ROWS*B;
  const NB=Math.round(B/2); // next piece canvas uses half-size blocks
  nc.width=4*NB;nc.height=4*NB;
  nc.dataset.nb=NB;
}
window.addEventListener('resize',()=>{resize();draw();});

function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawBlock(ctx,gx2,gy2,cid,al=1){
  if(!cid)return;
  const c=CL[cid],p=1.2,s=B;
  const x=gx2*s+p,y=gy2*s+p,w=s-p*2,h=s-p*2,r=Math.max(3,w*0.12);
  ctx.save();
  rr(ctx,x,y,w,h,r);ctx.clip();

  // frosted glass base — semi-transparent for nebula to show through
  const bg=ctx.createLinearGradient(x,y,x+w*0.3,y+h);
  bg.addColorStop(0,c.h+'48');
  bg.addColorStop(0.35,c.m+'38');
  bg.addColorStop(0.75,c.m+'42');
  bg.addColorStop(1,c.d+'68');
  ctx.globalAlpha=al;
  ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);

  // refraction diagonal bands
  for(let i=0;i<4;i++){
    const off=i*0.22;
    const rg=ctx.createLinearGradient(x+w*off,y,x+w*(off+0.18),y+h);
    rg.addColorStop(0,'rgba(255,255,255,0.0)');
    rg.addColorStop(0.5,`rgba(255,255,255,${0.06+i*0.01})`);
    rg.addColorStop(1,'rgba(255,255,255,0.0)');
    ctx.fillStyle=rg;ctx.fillRect(x,y,w,h);
  }

  // big top-left specular gleam
  const hl=ctx.createRadialGradient(x+w*0.3,y+h*0.18,0,x+w*0.3,y+h*0.18,w*0.6);
  hl.addColorStop(0,'rgba(255,255,255,0.82)');
  hl.addColorStop(0.25,'rgba(255,255,255,0.28)');
  hl.addColorStop(0.6,'rgba(255,255,255,0.06)');
  hl.addColorStop(1,'rgba(255,255,255,0.0)');
  ctx.fillStyle=hl;ctx.fillRect(x,y,w*0.75,h*0.62);

  // subtle colour tint reflection bottom-right
  const cr=ctx.createRadialGradient(x+w*0.8,y+h*0.85,0,x+w*0.8,y+h*0.85,w*0.5);
  cr.addColorStop(0,c.h+'22');cr.addColorStop(1,'rgba(0,0,0,0.0)');
  ctx.fillStyle=cr;ctx.fillRect(x+w*0.3,y+h*0.4,w*0.7,h*0.6);

  // bottom shadow
  const bs=ctx.createLinearGradient(x,y+h*0.5,x,y+h);
  bs.addColorStop(0,'rgba(0,0,0,0.0)');bs.addColorStop(1,'rgba(0,0,0,0.32)');
  ctx.fillStyle=bs;ctx.fillRect(x,y,w,h);
  ctx.restore();

  // glowing border
  ctx.save();
  ctx.globalAlpha=al*0.8;
  ctx.strokeStyle=c.h;ctx.lineWidth=1;
  ctx.shadowColor=c.h;ctx.shadowBlur=12;
  rr(ctx,x+0.5,y+0.5,w-1,h-1,r);ctx.stroke();
  ctx.restore();

  // outer colour aura
  ctx.save();
  ctx.globalAlpha=al*0.12;
  ctx.strokeStyle=c.h;ctx.lineWidth=4;
  ctx.shadowColor=c.h;ctx.shadowBlur=24;
  rr(ctx,x-1,y-1,w+2,h+2,r+1);ctx.stroke();
  ctx.restore();
}

function drawGhost(ctx,gx2,gy2,cid){
  const c=CL[cid],p=1.2,s=B;
  const x=gx2*s+p,y=gy2*s+p,w=s-p*2,h=s-p*2,r=Math.max(3,w*0.12);
  ctx.save();
  ctx.globalAlpha=0.28;ctx.strokeStyle=c.h;ctx.lineWidth=1.5;
  ctx.shadowColor=c.h;ctx.shadowBlur=10;
  rr(ctx,x,y,w,h,r);ctx.stroke();
  ctx.restore();
}

/* state */
let board,piece,px,py,pid,nxt;
let score=0,lines=0,level=1,best=0;
let running=false;
let dt=null,di=480;

function initB(){board=Array.from({length:ROWS},()=>new Array(COLS).fill(0));}
function rp(){return 1+Math.floor(Math.random()*7);}

function spawn(){
  pid=nxt||rp();nxt=rp();
  piece=SH[pid];
  px=Math.floor((COLS-piece[0].length)/2);py=0;
  if(col(piece,px,py)){gameOver();return false;}
  return true;
}
function col(p,ox,oy){
  for(let r=0;r<p.length;r++)for(let c=0;c<p[r].length;c++)
    if(p[r][c]){const nx2=ox+c,ny=oy+r;
      if(nx2<0||nx2>=COLS||ny>=ROWS)return true;
      if(ny>=0&&board[ny][nx2])return true;}
  return false;
}
function rotateCW(p){
  const R=p.length,C=p[0].length;
  const n=Array.from({length:C},()=>new Array(R).fill(0));
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)n[c][R-1-r]=p[r][c];
  return n;
}

function lock(){
  for(let r=0;r<piece.length;r++)for(let c=0;c<piece[r].length;c++)
    if(piece[r][c])board[py+r][px+c]=piece[r][c];
  sfxLock();clearLines();spawn();
}

function clearLines(){
  let cl=0,rows=[];
  for(let r=ROWS-1;r>=0;r--){
    if(board[r].every(v=>v)){
      rows.push(r);board.splice(r,1);board.unshift(new Array(COLS).fill(0));cl++;r++;
    }
  }
  if(!cl)return;
  const pts=[0,100,300,500,800];
  score+=pts[cl]*level;lines+=cl;
  const nl=Math.floor(lines/10)+1;
  if(nl>level){level=nl;di=Math.max(55,480-((level-1)*46));sfxLevelUp();}
  if(score>best){best=score;document.getElementById('h-best').textContent=best;}
  document.getElementById('h-score').textContent=score;
  document.getElementById('h-level').textContent=level;
  sfxClear(cl);flashScreen();showCombo(cl);
  const rect=gc.getBoundingClientRect();
  rows.forEach(ry=>burstLine(ry,COLS,B,rect));
  resetDT();
}

function ghostY(){let g=py;while(!col(piece,px,g+1))g++;return g;}

const CT=[null,'NICE!','DOUBLE!','TRIPLE!!','TETRIS!!!'];
function showCombo(n){
  const el=document.getElementById('combo');
  const colors=['','#00e5ff','#ea80fc','#ff5f7e','#ffd600'];
  el.textContent=CT[Math.min(n,4)]||'!!!';
  el.style.color=colors[Math.min(n,4)];
  el.style.fontSize=(28+n*7)+'px';
  el.style.textShadow=`0 0 30px ${colors[Math.min(n,4)]},0 0 60px ${colors[Math.min(n,4)]}`;
  el.style.transform='translate(-50%,-50%) scale(1)';
  el.style.opacity='1';
  clearTimeout(el._t);el._t=setTimeout(()=>{
    el.style.transform='translate(-50%,-50%) scale(0)';el.style.opacity='0';},750);
}

function flashScreen(){
  const f=document.getElementById('flash');
  f.style.background='rgba(255,255,255,0.2)';
  f.style.opacity='1';setTimeout(()=>f.style.opacity='0',55);
}

function scorePopup(val,x2,y2){
  const d=document.createElement('div');
  d.className='spop';d.textContent='+'+val;
  d.style.left=x2+'px';d.style.top=y2+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),850);
}

/* ── DRAW ── */
function draw(){
  const W=gc.width,H=gc.height;
  gx.clearRect(0,0,W,H);

  // dark tint so board is readable but nebula glows through
  gx.fillStyle='rgba(2,0,12,0.50)';
  gx.fillRect(0,0,W,H);

  // grid lines
  gx.save();gx.strokeStyle='rgba(255,255,255,0.032)';gx.lineWidth=0.5;
  for(let c=0;c<=COLS;c++){gx.beginPath();gx.moveTo(c*B,0);gx.lineTo(c*B,H);gx.stroke();}
  for(let r=0;r<=ROWS;r++){gx.beginPath();gx.moveTo(0,r*B);gx.lineTo(W,r*B);gx.stroke();}
  gx.restore();

  // board
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    if(board[r][c])drawBlock(gx,c,r,board[r][c]);

  // ghost
  if(piece){const gy=ghostY();
    for(let r=0;r<piece.length;r++)for(let c=0;c<piece[r].length;c++)
      if(piece[r][c])drawGhost(gx,px+c,gy+r,piece[r][c]);}

  // active piece
  if(piece)for(let r=0;r<piece.length;r++)for(let c=0;c<piece[r].length;c++)
    if(piece[r][c])drawBlock(gx,px+c,py+r,piece[r][c]);

  // next
  nx.clearRect(0,0,nc.width,nc.height);
  if(nxt){const np=SH[nxt];
    const NB=parseInt(nc.dataset.nb)||Math.round(B/2);
    const ox=Math.floor((4-np[0].length)/2),oy=Math.floor((4-np.length)/2);
    for(let r=0;r<np.length;r++)for(let c=0;c<np[r].length;c++)
      if(np[r][c]){
        // draw with NB-sized blocks instead of B
        const savedB=B; B=NB;
        drawBlock(nx,ox+c,oy+r,np[r][c]);
        B=savedB;
      }
  }
}

function resetDT(){
  clearInterval(dt);
  if(running)dt=setInterval(()=>{
    if(!col(piece,px,py+1))py++;else lock();draw();},di);
}

function moveL(){if(!col(piece,px-1,py)){px--;sfxMove();draw();}}
function moveR(){if(!col(piece,px+1,py)){px++;sfxMove();draw();}}
function rot(){
  const r2=rotateCW(piece);let k=0;
  if(col(r2,px,py)){
    if(!col(r2,px+1,py))k=1;
    else if(!col(r2,px-1,py))k=-1;
    else if(!col(r2,px+2,py))k=2;
    else if(!col(r2,px-2,py))k=-2;
    else return;
  }
  piece=r2;px+=k;sfxRotate();draw();
}
function hardDrop(){
  const gy=ghostY(),pts2=2*(gy-py);
  score+=pts2;py=gy;
  document.getElementById('h-score').textContent=score;
  const rect=gc.getBoundingClientRect();
  // burst at lock position
  for(let c=0;c<piece[0].length;c++)
    burst(rect.left+(px+c+0.5)*B,rect.top+(py+0.5)*B,CL[pid].h,12,5);
  sfxDrop();lock();draw();resetDT();
}

function gameOver(){
  running=false;clearInterval(dt);sfxGameOver();
  document.getElementById('ov-title').textContent='GAME\nOVER';
  document.getElementById('ov-sub').textContent='FINAL SCORE';
  const os=document.getElementById('ov-score');
  os.style.display='block';os.textContent=score;
  document.getElementById('start-btn').textContent='▶ RETRY';
  document.getElementById('overlay').style.display='flex';
}

function startGame(){
  resumeAC();initB();
  score=0;lines=0;level=1;di=480;
  document.getElementById('h-score').textContent=0;
  document.getElementById('h-level').textContent=1;
  document.getElementById('overlay').style.display='none';
  nxt=rp();running=true;spawn();draw();resetDT();
}

document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('start-btn').addEventListener('touchend',e=>{e.preventDefault();startGame();},{passive:false});

/* ── KEYBOARD ── */
document.addEventListener('keydown',e=>{
  if(!running)return;
  if(e.key==='ArrowLeft')moveL();
  else if(e.key==='ArrowRight')moveR();
  else if(e.key==='ArrowDown')hardDrop();
  else if(e.key==='ArrowUp')rot();
  else if(e.key===' '){e.preventDefault();hardDrop();}
});

/* ── TOUCH / GESTURE ── */
let ts=null,tm=false;
const SWIPE=32,TAP=14;

document.addEventListener('touchstart',e=>{
  resumeAC();
  if(!running)return;
  const t=e.touches[0];
  ts={x:t.clientX,y:t.clientY,t:Date.now()};tm=false;
},{passive:true});

document.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!running||!ts)return;
  const t=e.touches[0];
  const dx=t.clientX-ts.x,dy=t.clientY-ts.y;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(adx>TAP||ady>TAP)tm=true;
  // live horizontal slide — move per BLOCK
  if(adx>ady&&adx>B*0.7){
    const steps=Math.floor(adx/(B*0.7));
    for(let i=0;i<steps;i++)dx>0?moveR():moveL();
    ts.x=t.clientX;
  }
},{passive:false});

document.addEventListener('touchend',e=>{
  if(!running||!ts)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-ts.x,dy=t.clientY-ts.y;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  const elapsed=Date.now()-ts.t;
  if(!tm&&adx<TAP&&ady<TAP&&elapsed<320){
    // tap: left/right half
    const mid=gc.getBoundingClientRect().left+gc.width/2;
    t.clientX<mid?moveL():moveR();
  } else if(ady>adx&&ady>SWIPE){
    dy<0?rot():hardDrop();
  }
  ts=null;
},{passive:true});

/* mouse fallback */
let ms=null;
document.addEventListener('mousedown',e=>{if(!running)return;ms={x:e.clientX,y:e.clientY};});
document.addEventListener('mouseup',e=>{
  if(!running||!ms)return;
  const dx=e.clientX-ms.x,dy=e.clientY-ms.y;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  if(adx<TAP&&ady<TAP){
    const mid=gc.getBoundingClientRect().left+gc.width/2;
    e.clientX<mid?moveL():moveR();
  } else if(ady>adx&&ady>SWIPE){dy<0?rot():hardDrop();}
  ms=null;
});

resize();draw();
</script>
</body>
</html>
